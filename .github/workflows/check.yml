name: hygiene-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prove every gate can fail
        run: |
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/check-hygiene.sh --selftest
      - name: Check hygiene
        run: ./scripts/check-hygiene.sh HEAD
      - name: Show what an adopter sees
        run: |
          ./scripts/build-template.py --profile full | head -n 30
          ./scripts/install.sh --list
          ./scripts/phases.py --phase 0
